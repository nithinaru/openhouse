<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wish you were here — how a house gets built</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { font-family: Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

  #stage { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: center center; pointer-events: none; }
  #all { position: absolute; inset: 0; transition: opacity .6s ease; }
  #all.leave > *:not(.world) { opacity: 0 !important; transition: opacity .6s ease !important; }

  /* ---------- lines ---------- */
  svg.lines { position: absolute; inset: 0; width: 1440px; height: 900px; overflow: visible; pointer-events: none; }
  svg.lines line { stroke-linecap: round; transition: opacity .5s ease; }

  /* ---------- hub ---------- */
  .hub { position: absolute; left: 520px; top: 370px; width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle at 38% 28%, #3C3C3E 0%, #1A1A1C 55%, #0E0E10 100%); border: 2px solid #050505;
    box-shadow: 0 34px 60px rgba(0,0,0,.28), 0 8px 18px rgba(0,0,0,.18);
    display: flex; align-items: center; justify-content: center; transform: scale(.6); opacity: 0;
    transition: transform .7s cubic-bezier(.2,1.4,.4,1), opacity .5s ease; z-index: 7; }
  .hub.show { transform: scale(1); opacity: 1; }
  .hub::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 1.5px solid rgba(17,17,17,.35); opacity: 0; }
  .hub.busy::after { animation: ring 1.6s ease-out infinite; }
  .hub.gulp { animation: gulp .3s ease; }
  @keyframes gulp { 50% { transform: scale(1.06); } }
  @keyframes ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.45); opacity: 0; } }
  .hub .hl { position: absolute; top: calc(100% + 14px); left: 50%; transform: translateX(-50%); white-space: nowrap;
    font: 500 12px 'JetBrains Mono', monospace; color: #8A8A8D; letter-spacing: .02em; }

  /* ---------- pills ---------- */
  .pill { position: absolute; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 10px;
    border-radius: 28px; color: #fff; white-space: nowrap; font-weight: 600; font-size: 19px; letter-spacing: -.01em;
    background: linear-gradient(90deg, #6E6E71 0%, #A9A9AC 100%);
    box-shadow: 0 18px 36px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.25);
    transform: rotate(-4deg) scale(.85); opacity: 0;
    transition: opacity .45s ease, transform .55s cubic-bezier(.2,1.2,.3,1), filter .6s ease,
                left .9s cubic-bezier(.65,0,.25,1), top .9s cubic-bezier(.65,0,.25,1), box-shadow .4s ease; z-index: 4; }
  .pill::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, #1C1C1E 0%, #505053 100%); opacity: 0; transition: opacity .4s ease; }
  .pill > * { position: relative; }
  .pill.show { opacity: 1; transform: rotate(-4deg) scale(1); }
  .pill.light { background: linear-gradient(90deg, #C4C4C7 0%, #7A7A7D 100%); }
  .pill.active { box-shadow: 0 22px 44px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.18); transform: rotate(-4deg) scale(1.04); opacity: 1; }
  .pill.active::before, .pill.match::before { opacity: 1; }
  .pill.match { opacity: 1; box-shadow: 0 22px 44px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.18); }
  .av { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: 0 0 0 2px rgba(255,255,255,.9); background: #ddd; }
  .icon { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: #F4F4F4; display: flex; align-items: center; justify-content: center; }
  .badge { width: 0; height: 26px; margin-left: -12px; border-radius: 13px; background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
    opacity: 0; transform: scale(.4); transition: width .3s ease, margin .3s ease, opacity .3s ease, transform .4s cubic-bezier(.2,1.6,.4,1); }
  .badge.show { width: 26px; margin-left: 0; opacity: 1; transform: scale(1); }
  .pill.ping { animation: ping .55s ease; }
  @keyframes ping { 40% { transform: rotate(-4deg) scale(1.1); } }

  /* camera-roll preview that rides along with a pill */
  .stack { position: absolute !important; left: calc(100% + 16px); top: 50%; height: 50px; width: 110px; transform: translateY(-50%); }
  .stack .s { position: absolute; top: 0; width: 46px; height: 50px; border-radius: 9px; border: 2.5px solid #fff; background: #ddd center/cover;
    box-shadow: 0 10px 20px rgba(0,0,0,.18); opacity: 0; transform: scale(.5) rotate(0deg); transition: opacity .3s ease, transform .45s cubic-bezier(.2,1.5,.4,1); }
  .stack.show .s { opacity: 1; }
  .stack.show .s:nth-child(1) { transform: rotate(-9deg); }
  .stack.show .s:nth-child(2) { transform: rotate(3deg); left: 18px; }
  .stack.show .s:nth-child(3) { transform: rotate(11deg); left: 36px; }
  .stack .n { position: absolute; left: 70px; top: -10px; min-width: 30px; height: 26px; padding: 0 8px; border-radius: 13px; background: #111; color: #fff;
    font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2.5px #fff;
    opacity: 0; transform: scale(.4); transition: opacity .25s ease .15s, transform .4s cubic-bezier(.2,1.6,.4,1) .15s; }
  .stack.show .n { opacity: 1; transform: none; }
  .stack.spent .s { opacity: .35; }

  /* ---------- cards ---------- */
  .card { position: absolute; background: #fff; border: 1px solid #EDEDED; box-shadow: 0 30px 60px rgba(0,0,0,.12), 0 6px 14px rgba(0,0,0,.05);
    opacity: 0; transition: opacity .45s ease, transform .55s cubic-bezier(.2,1.2,.3,1); z-index: 6; }


  .thought { left: 450px; top: 150px; display: flex; align-items: center; gap: 14px; padding: 14px 22px 14px 14px; border-radius: 30px;
    transform: rotate(-3deg) translateY(14px) scale(.96); }
  .thought.show { opacity: 1; transform: rotate(-3deg); }
  .thought .mark { width: 36px; height: 36px; border-radius: 50%; background: #111; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 3px; }
  .thought .mark i { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
  .thought .mark i:nth-child(2) { animation-delay: .2s; } .thought .mark i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .25; } 40% { opacity: 1; } }
  .thought .kicker { font: 500 12px 'JetBrains Mono', monospace; color: #8A8A8D; }
  .thought .title { font-weight: 600; font-size: 20px; letter-spacing: -.01em; color: #111; white-space: nowrap; }
  .thought .txt { transition: opacity .25s ease; }
  .dot { position: absolute; border-radius: 50%; background: #F4F4F4; border: 1px solid #D6D6D6; box-shadow: 0 6px 14px rgba(0,0,0,.08);
    opacity: 0; transform: scale(.3); transition: opacity .3s ease, transform .4s cubic-bezier(.2,1.6,.4,1); z-index: 6; }
  .dot.show { opacity: 1; transform: scale(1); }
  .d1 { left: 590px; top: 262px; width: 18px; height: 18px; } .d2 { left: 606px; top: 304px; width: 12px; height: 12px; }

  .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: #F5F5F5; }
  .row .ri { width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; background: #fff; border: 1px solid #E6E6E6; display: flex; align-items: center; justify-content: center; }
  .row .label { flex: 1; font-weight: 500; font-size: 15px; color: #111; }
  .row .val { font-weight: 500; font-size: 13px; color: #8A8A8D; opacity: 0; transform: translateX(4px); transition: opacity .25s ease, transform .25s ease; }
  .row .val.show { opacity: 1; transform: none; }
  .row .val.bad { color: #111; }
  .status { width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .status.wait { border: 2px solid #DADADA; border-top-color: #111; animation: spin .7s linear infinite; }
  .status.yes { background: #111; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  .status.no { background: #fff; border: 1.5px solid #111; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }

  /* camera roll */
  .roll { left: 40px; top: 176px; width: 446px; padding: 16px; border-radius: 28px; transform: rotate(-2deg) translateY(18px) scale(.95); }
  .roll.show { opacity: 1; transform: rotate(-2deg); }
  .roll .rh { display: flex; align-items: center; gap: 10px; padding: 0 4px 12px; }
  .roll .rh .av { width: 32px; height: 32px; box-shadow: none; }
  .roll .rn { font-weight: 600; font-size: 16px; color: #111; line-height: 19px; }
  .roll .rs { font-size: 13px; color: #8A8A8D; line-height: 16px; }
  .roll .rc { margin-left: auto; text-align: right; }
  .roll .rc b { display: block; font-size: 22px; letter-spacing: -.02em; color: #111; font-variant-numeric: tabular-nums; line-height: 24px; }
  .roll .rc span { font-size: 12px; color: #8A8A8D; }
  .rchips { display: flex; gap: 5px; padding: 0 2px 12px; white-space: nowrap; }
  .rchips span { font: 500 11px 'JetBrains Mono', monospace; padding: 6px 9px; border-radius: 999px; background: #F2F2F2; color: #8A8A8D; transition: background .25s ease, color .25s ease; }
  .rchips span.on { background: #111; color: #fff; }
  .grid { position: relative; display: grid; grid-template-columns: repeat(6, 64px); gap: 6px; border-radius: 14px; overflow: hidden; }
  .th { position: relative; width: 64px; height: 64px; border-radius: 8px; background: #ddd center/cover; transition: opacity .35s ease, filter .35s ease, transform .35s ease, box-shadow .3s ease; }
  .th.out { opacity: .14; filter: grayscale(1); transform: scale(.9); }
  .th.hit { box-shadow: 0 0 0 2.5px #111; }
  .th .ok { position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: #111; display: none; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff; }
  .th.hit .ok { display: flex; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  .th.lifted { opacity: .25; }
  .sweep { position: absolute; left: 0; right: 0; top: -40px; height: 40px; pointer-events: none; opacity: 0;
    background: linear-gradient(transparent, rgba(17,17,17,.10) 80%, rgba(17,17,17,.7) 97%, transparent); }
  .sweep.go { opacity: 1; animation: sweep .55s cubic-bezier(.5,0,.5,1) forwards; }
  @keyframes sweep { from { top: -40px; } to { top: 100%; } }

  /* pipeline steps under the hub */
  .pipe { left: 452px; top: 586px; width: 296px; padding: 14px; border-radius: 24px; display: flex; flex-direction: column; gap: 4px;
    transform: translateY(16px) scale(.95); }
  .pipe.show { opacity: 1; transform: none; }
  .pipe .ph { font: 500 12px 'JetBrains Mono', monospace; color: #8A8A8D; padding: 0 4px 6px; }
  .pipe .row { padding: 8px 10px; }
  .pipe .label { font-size: 14px; }
  .pipe .val { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #111; }
  .pipe .status { width: 20px; height: 20px; }

  /* World Labs API card */
  .api { left: 896px; top: 176px; width: 458px; padding: 16px; border-radius: 28px; transform: translateY(18px) scale(.95); color: #111; }
  .api.show { opacity: 1; transform: none; }
  .api .ah { display: flex; align-items: center; gap: 12px; padding: 0 4px 12px; }
  .wl { width: 40px; height: 40px; border-radius: 12px; background: #111; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .api .an { font-weight: 700; font-size: 20px; letter-spacing: -.02em; line-height: 22px; }
  .api .as { font-size: 13px; color: #8A8A8D; }
  .api .tag { margin-left: auto; font: 600 11px 'JetBrains Mono', monospace; padding: 6px 10px; border-radius: 999px; background: #F2F2F2; color: #555; display: flex; align-items: center; gap: 7px; }
  .api .tag i { width: 7px; height: 7px; border-radius: 50%; background: #9A9A9D; }
  .api .tag.live i { background: #111; animation: blink 1s infinite; }
  .code { background: #F6F6F6; border-radius: 18px; padding: 14px 16px; font: 400 13px/21px 'JetBrains Mono', monospace; color: #6A6A6D; }
  .code .ln { opacity: 0; transform: translateY(3px); transition: opacity .25s ease, transform .25s ease; white-space: pre; }
  .code .ln.show { opacity: 1; transform: none; }
  .code .ln.verb { color: #111; font-weight: 600; margin-bottom: 4px; }
  .code b { color: #111; font-weight: 500; }
  .code s { text-decoration: none; color: #9A6B2F; }
  .slots { display: grid; grid-template-columns: repeat(4, 86px); gap: 8px; margin: 6px 0 6px 28px; }
  .slot { width: 86px; height: 70px; border-radius: 10px; border: 1.5px dashed #D2D2D2; background: #fff center/cover; transition: border-color .2s ease; }
  .slot.full { border: 0; box-shadow: 0 4px 10px rgba(0,0,0,.12); }
  .resp { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 16px; background: #111; color: #fff;
    font: 500 13px 'JetBrains Mono', monospace; max-height: 0; opacity: 0; overflow: hidden; padding-top: 0; padding-bottom: 0;
    transition: max-height .4s ease, opacity .3s ease, padding .4s ease; }
  .resp.open { max-height: 60px; opacity: 1; padding-top: 10px; padding-bottom: 10px; }
  .resp .dim { color: #9A9A9D; }

  .flyer { position: absolute; border-radius: 10px; background: #ddd center/cover; border: 2px solid #fff; box-shadow: 0 12px 24px rgba(0,0,0,.2); z-index: 9; will-change: transform; }
  .pulse { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #111; box-shadow: 0 0 0 5px rgba(17,17,17,.12); z-index: 5; opacity: 0; }

  /* ---------- world (live 360 generation) ---------- */
  .world { position: absolute; z-index: 10; overflow: hidden; background: #EFECE7; border-radius: 28px; opacity: 0;
    box-shadow: 0 40px 80px rgba(0,0,0,.18), 0 8px 18px rgba(0,0,0,.08);
    transition: left 1.15s cubic-bezier(.65,0,.25,1), top 1.15s cubic-bezier(.65,0,.25,1), width 1.15s cubic-bezier(.65,0,.25,1),
                height 1.15s cubic-bezier(.65,0,.25,1), border-radius 1.15s ease, opacity .4s ease; }
  .world.show { opacity: 1; }
  .world canvas { position: absolute; left: 50%; top: 50%; width: 1320px; height: 800px; transform: translate(-50%, -50%); }
  .world .prints { position: absolute; left: 50%; top: 50%; width: 1320px; height: 800px; transform: translate(-50%, -50%); }
  .wf { position: absolute; left: 0; top: 0; will-change: transform; }
  .print { width: 116px; padding: 6px 6px 18px; margin: -72px 0 0 -58px; background: #fff; border-radius: 4px; box-shadow: 0 16px 34px rgba(0,0,0,.28);
    opacity: 0; transform: scale(.4) rotate(var(--r)); transition: opacity .35s ease, transform .5s cubic-bezier(.2,1.5,.4,1), filter .9s ease; }
  .print div { width: 104px; height: 112px; background: #ccc center/cover; border-radius: 2px; }
  .print.in { opacity: 1; transform: scale(1) rotate(var(--r)); }
  .print.melt { opacity: 0; transform: scale(1.35) rotate(var(--r)); filter: blur(10px); transition: opacity 1.1s ease, transform 1.2s ease, filter 1.1s ease; }
  .hud { position: absolute; opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease; }
  .world.hudon .hud { opacity: 1; transform: none; }
  .chip { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 22px; background: rgba(255,255,255,.92);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 14px 30px rgba(0,0,0,.14); color: #111; }
  .chip .wl { width: 34px; height: 34px; border-radius: 10px; }
  .chip .t1 { font-weight: 700; font-size: 16px; letter-spacing: -.01em; line-height: 19px; }
  .chip .t2 { font: 500 12px 'JetBrains Mono', monospace; color: #8A8A8D; line-height: 16px; }
  .chip .sp { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #D0D0D0; border-top-color: #111; animation: spin .7s linear infinite; flex-shrink: 0; }
  .chip .okc { width: 22px; height: 22px; border-radius: 50%; background: #111; display: none; align-items: center; justify-content: center; flex-shrink: 0; }
  .ready .chip .sp { display: none; } .ready .chip .okc { display: flex; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  .h-tl { left: 22px; top: 22px; }
  .h-tr { right: 22px; top: 22px; }
  .h-tr .chip { padding: 10px 16px; flex-direction: column; align-items: flex-start; gap: 2px; }
  .h-tr .t2 b { color: #111; font-weight: 600; }
  .h-bl { left: 22px; bottom: 22px; width: 318px; padding: 12px; border-radius: 24px; background: rgba(255,255,255,.94);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 14px 30px rgba(0,0,0,.14); display: flex; flex-direction: column; gap: 4px; }
  .h-bl .row { padding: 8px 10px; }
  .h-bl .label { font-size: 14px; }
  .h-bl .val { font: 500 12px 'JetBrains Mono', monospace; color: #111; opacity: 1; transform: none; font-variant-numeric: tabular-nums; }
  .h-bl .status { width: 20px; height: 20px; }
  .h-br { right: 22px; bottom: 22px; display: flex; align-items: center; gap: 12px; }
  .compass { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 14px 30px rgba(0,0,0,.14); position: relative; }
  .compass svg { position: absolute; inset: 0; }
  .deg { font: 600 13px 'JetBrains Mono', monospace; color: #111; background: rgba(255,255,255,.92); padding: 8px 12px; border-radius: 14px; box-shadow: 0 14px 30px rgba(0,0,0,.14); font-variant-numeric: tabular-nums; }
  .stepin { position: absolute; left: 50%; bottom: 30px; transform: translate(-50%, 16px) scale(.9); opacity: 0; height: 56px; padding: 0 26px 0 12px;
    border-radius: 28px; background: linear-gradient(90deg, #1C1C1E 0%, #505053 100%); color: #fff; display: flex; align-items: center; gap: 12px;
    font-weight: 600; font-size: 19px; box-shadow: 0 22px 44px rgba(0,0,0,.3); transition: opacity .4s ease, transform .5s cubic-bezier(.2,1.4,.4,1); }
  .stepin .icon { background: #fff; }
  .ready .stepin { opacity: 1; transform: translate(-50%, 0); }
  .timelapse { position: absolute; left: 50%; top: 26px; transform: translateX(-50%); font: 500 11px 'JetBrains Mono', monospace; color: rgba(17,17,17,.55);
    background: rgba(255,255,255,.7); padding: 5px 10px; border-radius: 999px; opacity: 0; transition: opacity .5s ease; }
  .world.hudon .timelapse { opacity: 1; }

  /* ---------- finale: the black balloon wordmark, opened from the centre ---------- */
  #finale { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden;
    background: radial-gradient(ellipse 70% 60% at 50% 100%, #D3DAEE, transparent 70%), linear-gradient(#9DB5E2, #A3BAE5 60%, #BCC9EA);
    clip-path: circle(0 at 50% 50%); transition: clip-path 1.5s cubic-bezier(.65,0,.25,1); }
  #finale.show { clip-path: circle(80vmax at 50% 50%); }
  #finale .balloons { position: absolute; left: 50%; top: 50%; height: 100vh; aspect-ratio: 780 / 950; background: url(assets/backend/finale-balloons.jpg) center / cover;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent), linear-gradient(transparent, #000 5%, #000 92%, transparent);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent), linear-gradient(transparent, #000 5%, #000 92%, transparent);
    mask-composite: intersect; transform: translate(-50%, -50%) scale(1.18); transition: transform 2.6s cubic-bezier(.2,.8,.2,1); }
  #finale.show .balloons { transform: translate(-50%, -50%) scale(1); }
  #finale .float { position: absolute; inset: 0; animation: drift 7s ease-in-out infinite; }
  @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .hint { position: fixed; right: 18px; bottom: 14px; font: 500 12px Inter, system-ui; color: #9A9A9D; opacity: 0; transition: opacity .4s ease; }
  body.mouse .hint { opacity: 1; }
  html.capture .progress, html.capture .hint { display: none; }
  .progress { position: fixed; left: 0; bottom: 0; height: 2px; background: #111; width: 0; opacity: .15; }
</style>
</head>
<body>
<div id="stage"><div id="all"></div></div>
<div id="finale"><div class="float"><div class="balloons" role="img" aria-label="wish you were here, in black balloon letters in a blue sky"></div></div></div>
<div class="progress" id="progress"></div>
<div class="hint">space · pause &nbsp;&nbsp; r · restart &nbsp;&nbsp; f · full screen</div>

<script>
/* ============ data ============ */
const HUB = [600, 450];
const A = 'assets/', B = 'assets/backend/';
const ROOM = ['pose-LP1','pose-LP2','pose-LP3','pose-LP4','pose-LP5','pose-LP6','pose-LP7','pose-LP8','pose-LP9','pose-LP10',
              'cand-L1','cand-L2','cand-L3','cand-L4','cand-L5','cand-L6','cand-L7'].map(n => B + n + '.jpg');
// the 8 views that end up in the World Labs request (the living room)
const BEST = [0, 10, 3, 12, 6, 14, 1, 16].map(i => ROOM[i]);

// the five friends who were there that night
const PEOPLE = [
  { h: '@maya',  av: 'av-maya',  n: 7 },
  { h: '@theo',  av: 'av-theo',  n: 5 },

// the panorama as soft anisotropic splats at one cell size (cell = 2.5px · 2^level of the 2080px pano)
vec4 splatLevel(vec2 uv, float level, float q, float rev) {

      <div class="grid">${Array.from({ length: 24 }, () => `<div class="th"><div class="ok">${CHECK('#fff', 10)}</div></div>`).join('')}<div class="sweep"></div></div>
    </div>`);
  const pipe = h(`<div class="card pipe"><div class="ph">photos.prepare()</div>${PIPE.map(([l]) => `<div class="row"><div class="label">${l}</div><div class="val"></div><div class="status"></div></div>`).join('')}</div>`);
  const L = (cls, html) => `<div class="ln ${cls}">${html}</div>`;
  const api = h(`<div class="card api">
      <div class="ah"><div class="wl">${WLMARK()}</div><div><div class="an">World Labs</div><div class="as">World API · Marble</div></div><div class="tag"><i></i><span>idle</span></div></div>
      <div class="code">
        ${L('verb', 'POST /marble/v1/worlds:generate')}
        ${L('', '{')}
        ${L('', '  <b>"display_name"</b>: <s>"the delancey house"</s>,')}
        ${L('', '  <b>"world_prompt"</b>: {')}
        ${L('', '    <b>"type"</b>: <s>"multi-image"</s>,')}
        ${L('', '    <b>"reconstruct_images"</b>: <s>true</s>,')}
        ${L('', '    <b>"multi_image_prompt"</b>: [')}
        <div class="slots">${BEST.map(() => `<div class="slot"></div>`).join('')}</div>
        ${L('', '    ]')}
        ${L('', '  }')}
        ${L('', '}')}
      </div>
      <div class="resp"><span>200</span><span class="dim">operation_id</span><span>op_7f3a9c</span><span class="dim">· est. ~5 min</span></div>
    </div>`);
  const apiLine = svgLine(svg, [680, 450], [896, 450], '#111', 2.5);
  const pulse = h(`<div class="pulse"></div>`);

  const world = h(`<div class="world">
      <canvas></canvas><div class="prints">${ANCH.map(a => `<div class="wf"><div class="print" style="--r:${a.rot}deg"><div style="background-image:url(${a.src})"></div></div></div>`).join('')}</div>
      <div class="timelapse">time-lapse · ~5 min of generation</div>
      <div class="hud h-tl"><div class="chip"><div class="wl">${WLMARK(20)}</div><div><div class="t1 wt">Generating world</div><div class="t2">marble · reconstruction · 8 views</div></div><div class="sp"></div><div class="okc">${CHECK('#fff', 11)}</div></div></div>
      <div class="hud h-tr"><div class="chip"><div class="t2 poll"></div><div class="t2 pct"></div></div></div>
      <div class="hud h-bl">
        <div class="row"><div class="label">camera poses</div><div class="val"></div><div class="status"></div></div>
        <div class="row"><div class="label">depth + layout</div><div class="val"></div><div class="status"></div></div>
        <div class="row"><div class="label">gaussian splats</div><div class="val"></div><div class="status"></div></div>
        <div class="row"><div class="label">export .spz</div><div class="val"></div><div class="status"></div></div>
      </div>
      <div class="hud h-br"><div class="deg">0°</div><div class="compass"><svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="22" fill="none" stroke="#E2E2E2" stroke-width="1.5"/>
        <g class="cone"><path d="M32 32 L22 12 A22 22 0 0 1 42 12 Z" fill="rgba(17,17,17,.14)"/><line x1="32" y1="32" x2="32" y2="11" stroke="#111" stroke-width="2" stroke-linecap="round"/></g>
        <circle cx="32" cy="32" r="3.5" fill="#111"/></svg></div></div>
      <div class="stepin"><div class="icon">${DOOR}</div><span>step inside</span></div>
    </div>`);
  const canvas = $('canvas', world);

  [...people.map(p => p.pill), thought, d1, d2, roll, pipe, api, pulse, hub, world].forEach(e => all.appendChild(e));
  S = { svg, hub, thought, d1, d2, people, active, rollTether, roll, pipe, api, apiLine, pulse,
    world: { el: world, canvas, on: false, gl: null, prints: $$('.wf', world), rows: $$('.h-bl .row', world), poll: $('.poll', world), pct: $('.pct', world),
             deg: $('.deg', world), cone: $('.cone', world), op: 'op_7f3a9c' } };
}

function setThought(kicker, title) {
  const txt = $('.txt', S.thought);
  txt.style.opacity = 0;
  after(250, () => { $('.kicker', S.thought).textContent = kicker; $('.title', S.thought).textContent = title; txt.style.opacity = 1; });
}
function aimActive(to) { setLine(S.active, HUB, to); draw(S.active, 450); }
function setStatus(s, res) { s.className = 'status ' + res; s.innerHTML = res === 'wait' || !res ? '' : STATUS(res); }

/* ============ sequence ============ */
async function intro() {
  await wait(300); show(S.hub); S.hub.classList.add('busy');
  await wait(500);
  for (const p of S.people) {
    p.pill.classList.add('match'); show(p.pill); draw(p.line, 500);
    after(350, () => $('.badge', p.pill).classList.add('show'));
    await wait(140);
  }
  await wait(900);
}

// one camera roll: filters sweep through on-device, survivors lift out into the person's stack
async function readRoll(p, quick) {
  const R = S.roll, ths = $$('.th', R), counts = ROLL_COUNTS[p.h], chips = $$('.rchips span', R);
  $('.rh .av', R).src = A + p.av + '.jpg'; $('.rn', R).textContent = p.h;
  chips.forEach(c => c.classList.remove('on'));
  const hits = new Set(); while (hits.size < p.n) hits.add(Math.floor(rand() * 24));
  let ri = p.i * 3;
  ths.forEach((t, i) => {
    t.className = 'th';
    t.dataset.cut = hits.has(i) ? -1 : Math.min(4, Math.floor(rand() * rand() * 6));
    t.style.backgroundImage = hits.has(i) ? img(ROOM[ri++ % ROOM.length]) : otherBg(i + p.i * 5);
  });
  $('.rc b', R).textContent = counts[0];
  p.pill.classList.add('active');
  aimActive([SLOTS_A[p.i][0] + 12, SLOTS_A[p.i][1] + 28]);
  await wait(quick ? 250 : 500);
  for (let c = 0; c < FILTERS.length; c++) {
    chips[c].classList.add('on');
    const sw = $('.sweep', R); sw.classList.remove('go'); sw.getBoundingClientRect(); sw.classList.add('go');
    await wait(quick ? 150 : 330);
    ths.forEach(t => { if (+t.dataset.cut === c) t.classList.add('out'); });
    $('.rc b', R).textContent = counts[c + 1];
    await wait(quick ? 110 : 240);
  }
  ths.forEach((t, i) => { if (hits.has(i)) t.classList.add('hit'); });
  $('.rc span', R).textContent = 'from that night';
  await wait(quick ? 350 : 700);
  // survivors fly into the stack beside the pill
  const target = stagePoint(p.stack), hitEls = ths.filter((t, i) => hits.has(i));
  const flights = hitEls.map((t, k) => { const from = stagePoint(t); t.classList.add('lifted');
    return fly(t.style.backgroundImage, from, { x: target.x - 20 + Math.min(k, 2) * 18, y: target.y }, { s0: 64, s1: 46, dur: 650, delay: k * 70, arc: -50, r1: [-9, 3, 11][Math.min(k, 2)] }); });
  await Promise.all(flights);
  fillStack(p, hitEls.map(t => t.style.backgroundImage));
  p.pill.classList.remove('active');
  $('.rc span', R).textContent = 'photos';
  S.active.style.opacity = 0;
}
function fillStack(p, bgs) {
  $$('.s', p.stack).forEach((s, k) => s.style.backgroundImage = bgs[k]);
  p.photos = bgs; show(p.stack);
}

async function cameraRolls() {
  const ok = S.people;
  show(S.thought, S.d1, S.d2);
  await wait(400);
  show(S.roll); draw(S.rollTether);
  await wait(500);
  hide(S.thought, S.d1, S.d2);
  await readRoll(ok[0], false);
  await wait(250);
  await readRoll(ok[1], true);
  hide(S.roll); S.rollTether.style.opacity = 0;
  // the rest arrive the same way, straight from each phone
  let ri = 9;
  for (const p of ok.slice(2)) {
    p.pill.classList.add('ping');
    fillStack(p, Array.from({ length: 3 }, () => img(ROOM[ri++ % ROOM.length])));
    await wait(380);
  }
  await wait(700);
}

async function toWorldLabs() {
  const ok = S.people;
  // people slide to the left column, the API appears on the right
  ok.forEach((p, k) => { p.line.style.opacity = 0; p.pill.style.left = '64px'; p.pill.style.top = SLOTS_C[k] + 'px'; });
  await wait(1000);
  ok.forEach((p, k) => {
    // stack centre from layout (pill is rotated -4° about its own centre)
    const w = p.pill.offsetWidth, dx = w / 2 + 16 + 40;
    const sp = { x: 64 + w / 2 + dx * Math.cos(rad(4)), y: SLOTS_C[k] + 28 - dx * Math.sin(rad(4)) };
    setLine(p.line, [sp.x + 66, sp.y], HUB); p.line.setAttribute('stroke', 'url(#gl)');
    p.end = sp;
  });
  for (const p of ok) { draw(p.line, 450); await wait(80); }
  show(S.api);
  const lns = $$('.code .ln', S.api);
  for (const l of lns) { l.classList.add('show'); await wait(70); }
  setThought('convex action · photos.prepare', 'Picking the best 8 views');
  show(S.thought, S.d1, S.d2);
  await wait(500);

  // every matched photo streams into the backend
  let total = 0;
  const flights = [];
  ok.forEach((p, k) => {
    for (let j = 0; j < p.n; j++) {
      const bg = p.photos[j % p.photos.length] || img(ROOM[(k * 3 + j) % ROOM.length]);
      flights.push(fly(bg, { x: p.end.x - 10 + (j % 3) * 18, y: p.end.y }, { x: HUB[0], y: HUB[1] }, { s0: 46, s1: 20, dur: 750, delay: total * 75, arc: 30 * (k - 2), r0: [-9, 3, 11][j % 3] })
        .then(() => { S.hub.classList.remove('gulp'); S.hub.getBoundingClientRect(); S.hub.classList.add('gulp'); }));
      total++;
    }
    after(600, () => p.stack.classList.add('spent'));
  });
  show(S.pipe);
  const prow = $$('.row', S.pipe);
  for (let i = 0; i < PIPE.length; i++) {
    setStatus($('.status', prow[i]), 'wait');
    await wait(i === 0 ? 900 : 520);
    $('.val', prow[i]).textContent = PIPE[i][1];
    $('.val', prow[i]).classList.add('show');
    setStatus($('.status', prow[i]), 'yes');
  }
  await Promise.all(flights);
  hide(S.thought, S.d1, S.d2);

  // the best 8 go into the request
  draw(S.apiLine, 500);
  $('.tag span', S.api).textContent = 'uploading';
  const slots = $$('.slot', S.api);
  await Promise.all(BEST.map((src, k) => {
    const to = stagePoint(slots[k]);
    return fly(img(src), { x: HUB[0], y: HUB[1] }, to, { s0: 20, s1: 86, ratio: 70 / 86, dur: 800, delay: k * 120, arc: -70 + k * 12 })
      .then(() => { slots[k].style.backgroundImage = img(src); slots[k].classList.add('full'); });
  }));
  await wait(300);
  // send
  const tag = $('.tag', S.api); tag.classList.add('live'); $('span', tag).textContent = 'sending';
  S.pulse.style.left = '680px'; S.pulse.style.top = '450px';
  await S.pulse.animate([{ transform: 'translateX(0)', opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 1, offset: .85 }, { transform: 'translateX(216px)', opacity: 0 }],
    { duration: 600 / SPEED, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' }).finished;
  $('.resp', S.api).classList.add('open');
  $('span', tag).textContent = 'running';
  S.hub.classList.remove('busy');
  await wait(1100);
}

async function generate() {
  const W = S.world, el = W.el, r = stagePoint(S.api);
  // the API card opens up into the world as it's being generated
  Object.assign(el.style, { transition: 'none', left: r.x - r.w / 2 + 'px', top: r.y - r.h / 2 + 'px', width: r.w + 'px', height: r.h + 'px' });
  const st = $('#stage').getBoundingClientRect().width / 1440, k = Math.min(1.5, (devicePixelRatio || 1) * st);
  W.canvas.width = Math.round(1320 * k); W.canvas.height = Math.round(800 * k);
  if (!W.gl) W.gl = initGL(W.canvas);
  W.t0 = clock + 1300; W.on = true;
  $('#all').classList.add('leave');
  el.getBoundingClientRect();
  el.style.transition = '';
  show(el);
  Object.assign(el.style, { left: '60px', top: '50px', width: '1320px', height: '800px', borderRadius: '32px' });
  await wait(1300);
  el.classList.add('hudon');
  await wait(GEN.readyAt * 1000);
  el.classList.add('ready');
  $('.wt', el).textContent = 'World ready';
  $('.h-tl .t2', el).textContent = 'spz_urls · 100k · 500k · full_res';
  await wait(4200);
}

async function finale() {
  const W = S.world, el = W.el;
  // the world folds back into the circle it came from…
  el.classList.remove('hudon');
  Object.assign(el.style, { left: '520px', top: '370px', width: '160px', height: '160px', borderRadius: '80px' });
  await wait(1150);
  // …the circle collapses all the way out…
  Object.assign(el.style, { transition: 'all .55s cubic-bezier(.6,0,.4,1)', left: '600px', top: '450px', width: '0px', height: '0px' });
  await wait(600);
  W.on = false; el.style.opacity = 0;
  // …and the sky opens up from that point
  show($('#finale'));
}

async function run() {
  const id = ++runId;
  clock = 0;
  build();
  $('#finale').classList.remove('show');
  try {
    if (params.get('start') === 'world') {
      show(S.hub); S.api.classList.add('show'); await wait(400);
    } else {
      await intro();
      await cameraRolls();
      await toWorldLabs();
    }
    await generate();
    await finale();
    await wait(6000);
    document.documentElement.dataset.done = '1';
    if (LOOP && id === runId) { $('#finale').classList.remove('show'); await wait(1500); run(); }
  } catch (e) { if (e !== 'restart') throw e; }
}

/* ============ fit + controls ============ */
function fit() { const s = Math.min(innerWidth / 1440, innerHeight / 900); $('#stage').style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener('resize', fit); fit();
addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  if (e.key === 'r') { paused = false; run(); }
  if (e.key === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
let mt; addEventListener('mousemove', () => { document.body.classList.add('mouse'); clearTimeout(mt); mt = setTimeout(() => document.body.classList.remove('mouse'), 1800); });
Promise.all([document.fonts.ready, pano.decode().catch(() => {})]).then(run);
</script>
