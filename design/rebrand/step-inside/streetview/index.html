<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390, initial-scale=1" />
<title>openhouse — step in (360 street view)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; background: #0a0a0a; }
  body { font-family: 'Inter Tight', system-ui, sans-serif; color: #0a0a0a; -webkit-font-smoothing: antialiased; }
  .screen { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }

  /* ---------- ready screen ---------- */
  #ready { background: #b4d2f0; }
  #ready .title { top: 92px; left: 0; right: 0; text-align: center; }
  #ready .tag { display: inline-block; padding: 5px 12px; border-radius: 16px; background: #f7c5dd; border: 1.5px dashed #e2549e; font-weight: 700; font-size: 13px; transform: rotate(3deg); }
  #ready h1 { margin-top: 10px; font-weight: 700; font-size: 32px; line-height: 34px; letter-spacing: -0.035em; }
  #ready .sub { margin-top: 6px; font-weight: 500; font-size: 15px; color: #3d5e82; }
  #diorama { left: -30px; top: 236px; width: 450px; height: 450px; background: url(assets/diorama.jpg) center/cover; filter: contrast(1.22) saturate(1.18); transform-origin: 34% 52%; }
  #ready .fadeTop { left: 0; right: 0; top: 226px; height: 70px; background: linear-gradient(#b4d2f0 10%, rgba(180,210,240,0)); }
  #ready .fadeBot { left: 0; right: 0; top: 600px; height: 110px; background: linear-gradient(rgba(180,210,240,0), #b4d2f0 85%); }
  #stepBtn { left: 24px; right: 24px; bottom: 58px; height: 56px; border-radius: 28px; background: #0a0a0a; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 18px; }
  #ready .hint { left: 0; right: 0; bottom: 30px; text-align: center; font-weight: 600; font-size: 14px; color: #3d5e82; }

  /* ---------- 360 rooms ---------- */
  .room { position: absolute; inset: 0; perspective: 278px; perspective-origin: 50% 50%; overflow: hidden; background: #0d0a08; }
  .cyl { position: absolute; inset: 0; transform-style: preserve-3d; }
  .panel { position: absolute; left: 176.25px; top: -14.5px; width: 37.5px; height: 873px; background-repeat: no-repeat; background-size: 1747px 873px; backface-visibility: hidden; }
  .tile { position: absolute; left: 15px; top: 182px; width: 360px; height: 480px; backface-visibility: hidden; transform-style: preserve-3d; }
  .tile .ph { position: absolute; inset: 0; background-size: cover; background-position: center; box-shadow: 0 0 0 1.5px rgba(255,255,255,.55), 0 10px 26px rgba(0,0,0,.45); }
  .tile .who { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 5px; padding: 4px 9px 4px 4px; border-radius: 14px; background: rgba(255,255,255,.92); font-weight: 700; font-size: 11px; white-space: nowrap; }
  .who .av { width: 18px; height: 18px; border-radius: 9px; background: #f7c5dd; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; }
  .who .cam { color: #8a8a8a; font-weight: 600; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background:
      radial-gradient(circle at 1.5px 1.5px, rgba(0,0,0,0) .8px, rgba(0,0,0,.16) 1.5px) 0 0/3px 3px,
      linear-gradient(rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 17%, rgba(0,0,0,0) 66%, rgba(0,0,0,.6) 100%); }

  /* floor arrow (projected) */
  .arrow { position: absolute; top: 0; left: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; }
  .arrow .ring { position: absolute; inset: 0; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.85); background: radial-gradient(rgba(255,255,255,.32), rgba(255,255,255,0) 70%); transform: rotateX(64deg); }
  .arrow svg { position: absolute; left: 30px; top: 34px; transform: rotateX(48deg); }
  .arrowLabel { position: absolute; top: 0; left: 0; transform: translate(-50%, -100%); padding: 6px 12px; border-radius: 16px; background: #fff; font-weight: 700; font-size: 13px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.35); }

  /* chrome */
  .topbar { position: absolute; left: 0; right: 0; top: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .circleBtn { width: 40px; height: 40px; border-radius: 20px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .pill { height: 40px; padding: 0 16px; border-radius: 20px; background: #fff; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -0.02em; white-space: nowrap; }
  .pill .muted { color: #8a8a8a; font-weight: 500; font-size: 13px; }
  .compass { position: absolute; right: 16px; top: 104px; width: 46px; height: 46px; border-radius: 23px; background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center; }
  .minimap { position: absolute; left: 16px; bottom: 34px; width: 92px; height: 92px; border-radius: 22px; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
  .bottomText { position: absolute; left: 122px; right: 16px; bottom: 40px; color: #fff; }
  .nowChip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 6px; border-radius: 16px; background: #fff; color: #0a0a0a; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .nowChip .av { width: 22px; height: 22px; border-radius: 11px; background: #f7c5dd; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
  .nowChip .cam { color: #8a8a8a; font-weight: 600; }
  .bottomText .hint { margin-top: 8px; font-weight: 700; font-size: 17px; line-height: 20px; letter-spacing: -0.02em; }
  .bottomText .hint .sub { display: block; margin-top: 4px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); letter-spacing: 0; }

  .statusbar { position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 52px; font-family: system-ui; font-weight: 600; font-size: 17px; z-index: 50; }
  .touch { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255,255,255,.55); border: 2px solid rgba(255,255,255,.95); box-shadow: 0 0 0 6px rgba(255,255,255,.18); z-index: 60; pointer-events: none; opacity: 0; }
</style>

<body>
<div class="screen" id="root">
  <div class="layer" id="roomLiving"></div>
  <div class="layer" id="roomKitchen"></div>

  <div class="layer" id="ui">
    <div class="topbar">
      <div class="circleBtn"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 8L9 3L15 8V15H3Z" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"/></svg></div>

      <div class="circleBtn"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2V12M5 6L9 2L13 6M3 11V15H15V11" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="compass"><svg width="30" height="30" viewBox="-15 -15 30 30"><g id="compassNeedle"><path d="M0 -11L4 0H-4Z" fill="#e2549e"/><path d="M0 11L4 0H-4Z" fill="#c9c9c9"/></g></svg></div>
    <div class="minimap">

        <rect id="mmKitchen" x="47" y="39" width="28" height="36" fill="#f3f3f3" stroke="#0a0a0a" stroke-width="1.5"/>
        <rect x="47" y="3" width="28" height="36" stroke="#0a0a0a" stroke-width="1.5" stroke-dasharray="3 2"/>
        <g id="mmYou"><path d="M0 0L-12 -22H12Z" fill="#0a0a0a" fill-opacity=".2"/><circle r="5" fill="#0a0a0a" stroke="#fff" stroke-width="2"/></g>
      </svg>
    </div>
    <div class="bottomText">
      <div class="nowChip"><span class="av" id="nowAv">r</span><span id="nowWho">@rohan</span><span class="cam" id="nowCam">· iphone</span></div>
      <div class="hint" id="hint">look around<span class="sub" id="hintSub">6 photos built this room</span></div>

  </div>

  <div class="layer" id="ready">
    <div class="abs" id="diorama"></div>

    <div class="abs hint" id="readyHint">drag to spin · tap any cutout</div>
  </div>

  <div class="statusbar" id="statusbar"><span>9:41</span><svg width="82" height="22" viewBox="0 0 82 22" fill="currentColor"><path d="M3.7 13H2.5a1 1 0 0 0-1 1v2.5a1 1 0 0 0 1 1h1.2a1 1 0 0 0 1-1V14a1 1 0 0 0-1-1m5.2-2.5H7.7a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h1.2a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1M14.1 8h-1.2a1 1 0 0 0-1 1v7.5a1 1 0 0 0 1 1h1.2a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1m5.2-2.5h-1.2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h1.2a1 1 0 0 0 1-1v-10a1 1 0 0 0-1-1"/><path fill-rule="evenodd" d="M36.57 7.8c2.49 0 4.88.92 6.68 2.58.14.13.36.12.49 0l1.3-1.27a.34.34 0 0 0 0-.5 12.55 12.55 0 0 0-16.93 0 .34.34 0 0 0 0 .5l1.3 1.26c.13.13.34.14.48 0a10 10 0 0 1 6.68-2.57m0 4.22a5.4 5.4 0 0 1 3.67 1.44c.14.13.35.13.48 0l1.3-1.33a.37.37 0 0 0-.01-.52 7.9 7.9 0 0 0-10.88 0 .37.37 0 0 0 0 .52l1.29 1.32c.13.14.34.14.48 0 1-.92 2.31-1.43 3.67-1.43m2.52 2.8q0 .15-.1.28l-2.18 2.45a.3.3 0 0 1-.24.11.3.3 0 0 1-.24-.1l-2.18-2.46a.43.43 0 0 1 .01-.56 3.44 3.44 0 0 1 4.82 0 .4.4 0 0 1 .11.28" clip-rule="evenodd"/><path fill-rule="evenodd" opacity=".35" d="M70.5 5c2.05 0 3.08 0 3.88.34a4.3 4.3 0 0 1 2.28 2.28c.34.8.34 1.83.34 3.88s0 3.08-.34 3.88a4.3 4.3 0 0 1-2.28 2.28c-.8.34-1.83.34-3.88.34h-12c-2.05 0-3.08 0-3.88-.34a4.3 4.3 0 0 1-2.28-2.28c-.34-.8-.34-1.83-.34-3.88s0-3.08.34-3.88a4.3 4.3 0 0 1 2.28-2.28C55.42 5 56.45 5 58.5 5zM58.28 6c-1.85 0-2.77 0-3.48.36a3.3 3.3 0 0 0-1.44 1.44C53 8.5 53 9.43 53 11.28v.44c0 1.85 0 2.77.36 3.48a3.3 3.3 0 0 0 1.44 1.44c.7.36 1.63.36 3.48.36h12.44c1.85 0 2.77 0 3.48-.36a3.3 3.3 0 0 0 1.44-1.44c.36-.7.36-1.63.36-3.48v-.44c0-1.85 0-2.77-.36-3.48a3.3 3.3 0 0 0-1.44-1.44C73.5 6 72.57 6 70.72 6z" clip-rule="evenodd"/><path d="M54 11c0-1.4 0-2.1.27-2.63a2.5 2.5 0 0 1 1.1-1.1C55.9 7 56.6 7 58 7h13c1.4 0 2.1 0 2.64.27q.72.37 1.09 1.1C75 8.9 75 9.6 75 11v1c0 1.4 0 2.1-.27 2.64a2.5 2.5 0 0 1-1.1 1.09C73.1 16 72.4 16 71 16H58c-1.4 0-2.1 0-2.63-.27a2.5 2.5 0 0 1-1.1-1.1C54 14.1 54 13.4 54 12z"/><path opacity=".35" d="M78 9.5v4.08a2.2 2.2 0 0 0 1.33-2.04A2.2 2.2 0 0 0 78 9.5"/></svg></div>
  <div class="touch" id="touch"></div>
</div>

<script>
// ---------------- room data ----------------
const R = 278, PW = 2 * Math.PI * R, N = 48;
const ROOMS = {
  living: {
    pano: 'assets/pano-living.jpg',
    tiles: [
      { a: 0,   img: 'assets/living-a000.jpg', who: 'rohan', cam: 'iphone',  rz: -0.8, dx: 4,  dy: -6 },
      { a: 60,  img: 'assets/living-a060.jpg', who: 'ines',  cam: 'film',    rz: 1.2,  dx: -6, dy: 8 },
      { a: 120, img: 'assets/living-a120.jpg', who: 'theo',  cam: 'digicam', rz: -1.4, dx: 2,  dy: -4 },
      { a: 180, img: 'assets/living-a180.jpg', who: 'maya',  cam: 'iphone',  rz: 0.9,  dx: -4, dy: 6 },
      { a: 240, img: 'assets/living-a240.jpg', who: 'sol',   cam: '0.5x',    rz: -1.0, dx: 6,  dy: -8 },
      { a: 300, img: 'assets/living-a300.jpg', who: 'jules', cam: 'digicam', rz: 1.3,  dx: -3, dy: 4 },
    ],
    arrows: [{ a: 184, label: 'kitchen' }],
  },
  kitchen: {
    pano: 'assets/pano-kitchen.jpg',
    tiles: [
      { a: 0,   img: 'assets/kitchen-a000.jpg', who: 'jules', cam: 'digicam', rz: 1.1,  dx: -4, dy: 6 },
      { a: 60,  img: 'assets/kitchen-a060.jpg', who: 'maya',  cam: 'film',    rz: -1.2, dx: 5,  dy: -6 },
      { a: 120, img: 'assets/kitchen-a120.jpg', who: 'rohan', cam: 'iphone',  rz: 0.7,  dx: -2, dy: 4 },
      { a: 180, img: 'assets/kitchen-a180.jpg', who: 'theo',  cam: 'iphone',  rz: -0.9, dx: 3,  dy: -5 },
      { a: 240, img: 'assets/kitchen-a240.jpg', who: 'ines',  cam: 'film',    rz: 1.4,  dx: -5, dy: 7 },
      { a: 300, img: 'assets/kitchen-a300.jpg', who: 'sol',   cam: '0.5x',    rz: -1.1, dx: 4,  dy: -3 },
    ],
    arrows: [{ a: 300, label: 'living room' }],
  },
};

function buildRoom(rootId, room) {
  const root = document.getElementById(rootId);
  root.innerHTML = '<div class="room"><div class="cyl"></div><div class="vignette"></div></div>';
  const cyl = root.querySelector('.cyl');
  const step = PW / N;
  room.panels = [];
  for (let i = 0; i < N; i++) {
    const p = document.createElement('div');
    p.className = 'panel';
    p.style.backgroundImage = `url(${room.pano})`;
    p.style.backgroundPosition = `${-(i * step) + (37.5 - step) / 2}px 0`;
    p._a = (i + 0.5) * 360 / N;
    p.style.transform = `rotateY(${-p._a}deg) translateZ(${-R}px)`;
    cyl.appendChild(p); room.panels.push(p);
  }
  room.tileEls = room.tiles.map((t) => {
    const el = document.createElement('div');
    el.className = 'tile';
    el.innerHTML = `<div class="ph" style="background-image:url(${t.img})"></div><div class="who"><span class="av">${t.who[0]}</span>@${t.who} <span class="cam">· ${t.cam}</span></div>`;
    el._t = t;
    cyl.appendChild(el);
    return el;
  });
  room.arrowEls = room.arrows.map((a) => {
    const w = document.createElement('div');
    w.innerHTML = `<div class="arrow"><div class="ring"></div><svg width="60" height="52" viewBox="0 0 60 52"><path d="M10 38L30 14L50 38" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="arrowLabel">${a.label} ↑</div>`;
    root.querySelector('.room').appendChild(w);
    return { a, arrow: w.firstChild, label: w.lastChild };
  });
  room.cyl = cyl; room.root = root;
}
buildRoom('roomLiving', ROOMS.living);
buildRoom('roomKitchen', ROOMS.kitchen);

// ---------------- helpers ----------------
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeIO = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const wrap = (d) => ((d % 360) + 540) % 360 - 180;          // -180..180
function keyed(t, keys) {                                   // piecewise easeIO between [time, value]
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], easeIO(seg(t, keys[i - 1][0], keys[i][0])));
  return keys[keys.length - 1][1];
}

function drawRoom(room, yaw, { develop = () => 1, arrowOn = 1, arrowPress = 0 }) {
  room.cyl.style.transform = `translateZ(${R}px) rotateY(${yaw}deg)`;
  for (const p of room.panels) p.style.visibility = Math.abs(wrap(p._a - yaw)) < 100 ? 'visible' : 'hidden';
  room.tileEls.forEach((el, i) => {
    const t = el._t, d = wrap(t.a - yaw), dev = develop(i);
    el.style.visibility = Math.abs(d) < 105 ? 'visible' : 'hidden';
    el.style.transform = `rotateY(${-t.a}deg) translateZ(${-R + 3}px) translate(${t.dx}px, ${t.dy}px) rotateZ(${t.rz}deg) scale(${lerp(1.06, 1, dev)})`;
    el.style.opacity = dev;
    el.firstChild.style.filter = `blur(${lerp(9, 0, dev)}px)`;
  });
  for (const { a, arrow, label } of room.arrowEls) {
    const d = wrap(a.a - yaw), vis = Math.abs(d) < 38;
    const x = 195 + 265 * Math.tan(d * Math.PI / 180), y = 640;
    const o = vis ? arrowOn * clamp((38 - Math.abs(d)) / 10) : 0;
    arrow.style.left = x + 'px'; arrow.style.top = y + 'px';
    arrow.style.transform = `rotateZ(${d * 0.5}deg) scale(${1 - .12 * arrowPress})`;
    arrow.style.opacity = o;
    label.style.left = x + 'px'; label.style.top = (y - 66) + 'px'; label.style.opacity = o;
  }
  // which photo is in front of you
  let best = room.tiles[0], bd = 999;
  for (const t of room.tiles) { const d = Math.abs(wrap(t.a - yaw)); if (d < bd) { bd = d; best = t; } }
  return best;
}
function touch(t, at, x, y) {
  const el = $('touch');
  if (t < at - 250 || t > at + 350) return;
  const p = seg(t, at - 250, at + 350);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.transform = `scale(${lerp(1.15, .8, ease(seg(t, at - 100, at + 60)))})`;
  el.style.opacity = p < .2 ? p / .2 : p > .75 ? (1 - p) / .25 : 1;
}

// ---------------- timeline ----------------
const TOTAL = 17000;
const LIV_YAW = [[2400, 112], [4800, 30], [7900, 184], [9400, 184]];
const KIT_YAW = [[9600, 118], [12400, 34], [15600, -78], [17000, -82]];

function render(t) {
  t = ((t % TOTAL) + TOTAL) % TOTAL;
  $('touch').style.opacity = 0;

  // ready + tap
  const tapped = seg(t, 1150, 1300);
  $('stepBtn').style.transform = `scale(${1 - .04 * Math.sin(Math.PI * tapped)})`;
  touch(t, 1220, 195, 844 - 58 - 28);

  // dive into the house
  const dive = easeIO(seg(t, 1450, 2950));
  $('diorama').style.transform = `scale(${lerp(1, 5.2, dive)}) translateY(${lerp(0, 20, dive)}px)`;
  $('diorama').style.filter = `contrast(1.22) saturate(1.18) blur(${lerp(0, 6, seg(t, 2300, 2950))}px)`;
  for (const el of document.querySelectorAll('#ready .fadeTop, #ready .fadeBot')) el.style.opacity = 1 - ease(seg(t, 1450, 1900));
  const uiOut = ease(seg(t, 1450, 1850));
  for (const id of ['readyTitle', 'stepBtn', 'readyHint']) { $(id).style.opacity = 1 - uiOut; $(id).style.translate = `0 ${uiOut * (id === 'readyTitle' ? -20 : 20)}px`; }
  $('ready').style.opacity = 1 - ease(seg(t, 2350, 3000));
  $('ready').style.background = `rgba(180,210,240,${1 - dive})`;

  // living room
  const push = easeIO(seg(t, 9000, 10400));
  const livYaw = keyed(t, LIV_YAW);
  const livOrder = [2, 1, 0, 5, 4, 3]; // develops in the order you look at them
  const livFront = drawRoom(ROOMS.living, livYaw, {
    develop: (i) => ease(seg(t, 3000 + livOrder.indexOf(i) * 520, 3700 + livOrder.indexOf(i) * 520)),
    arrowOn: ease(seg(t, 7700, 8200)) * (1 - ease(seg(t, 9000, 9400))),
    arrowPress: Math.sin(Math.PI * seg(t, 8650, 8950)),
  });
  const livIn = ease(seg(t, 2400, 3300));
  $('roomLiving').style.opacity = livIn * (1 - ease(seg(t, 9700, 10400)));
  $('roomLiving').style.transform = `scale(${lerp(1.25, 1, livIn) * lerp(1, 2.3, push)})`;
  $('roomLiving').style.filter = `blur(${lerp(6, 0, livIn) + push * 9}px)`;
  touch(t, 8800, 195, 640);

  // kitchen
  const kitIn = ease(seg(t, 9700, 10700));
  const kitYaw = keyed(t, KIT_YAW);
  const kitFront = drawRoom(ROOMS.kitchen, kitYaw, {
    develop: (i) => ease(seg(t, 10200 + [2, 1, 0, 3, 5, 4][i] * 280, 10800 + [2, 1, 0, 3, 5, 4][i] * 280)),
    arrowOn: ease(seg(t, 15200, 15700)),
  });
  $('roomKitchen').style.opacity = kitIn;
  $('roomKitchen').style.transform = `scale(${lerp(.72, 1, kitIn)})`;
  $('roomKitchen').style.filter = `blur(${lerp(8, 0, kitIn)}px)`;

  // UI
  const inKitchen = t > 9900;
  const uiIn = ease(seg(t, 3300, 3900));
  $('ui').style.opacity = uiIn * (1 - .55 * Math.sin(Math.PI * seg(t, 9000, 10600)));
  $('roomName').textContent = inKitchen ? 'kitchen' : 'living room';
  $('roomEmoji').textContent = inKitchen ? '🍬' : '🎃';
  $('roomTime').textContent = inKitchen ? '· 11:40 pm' : '· 11:12 pm';
  const front = inKitchen ? kitFront : livFront;
  $('nowAv').textContent = front.who[0]; $('nowWho').textContent = '@' + front.who; $('nowCam').textContent = '· ' + front.cam;
  $('hint').firstChild.textContent = t > 7700 && t < 9000 ? 'tap the arrow to walk' : 'look around';
  $('hintSub').textContent = inKitchen ? '6 new photos built this room' : '6 photos built this room';
  $('compassNeedle').setAttribute('transform', `rotate(${-(inKitchen ? kitYaw + 90 : livYaw)})`);
  $('mmLiving').setAttribute('fill', inKitchen ? '#f3f3f3' : '#fbe3ee');
  $('mmKitchen').setAttribute('fill', inKitchen ? '#fbe3ee' : '#f3f3f3');
  const mv = easeIO(seg(t, 9000, 10200));
  const yawNow = inKitchen ? kitYaw + 90 : livYaw;
  $('mmYou').setAttribute('transform', `translate(${lerp(25, 61, mv)} ${lerp(40, 58, mv)}) rotate(${yawNow})`);
  $('statusbar').style.color = t < 2600 ? '#0a0a0a' : '#fff';
}

const params = new URLSearchParams(location.search);
window.render = render;
if (params.has('t')) render(+params.get('t'));
else { const s = performance.now(); const loop = (n) => { render(n - s); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
</html>
